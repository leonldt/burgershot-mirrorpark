name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: burgershot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate & Seed
        run: npx prisma migrate deploy && npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot_test
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: E2E
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot_test
      - name: E2E (browserlos – Auth/Rollen/SSE)
        run: npm run test:e2e:api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burgershot_test
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore